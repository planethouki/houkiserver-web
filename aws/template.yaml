AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: REST API for the Houki Server website

Parameters:
  AllowedOrigin:
    Type: String
    Description: Amplify site origin, for example https://www.houkiserver.com
    Default: '*'
  MinecraftHost:
    Type: String
    Default: mc.houkiserver.com
  MinecraftPort:
    Type: Number
    Default: 25565

Globals:
  Function:
    Runtime: nodejs22.x
    Architectures:
      - arm64
    MemorySize: 256
    Timeout: 5

Resources:
  StatusApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Ref AllowedOrigin
        AllowMethods:
          - GET
        AllowHeaders:
          - Content-Type
        MaxAge: 86400

  ServerStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: server-status/
      Handler: index.handler
      Environment:
        Variables:
          MINECRAFT_HOST: !Ref MinecraftHost
          MINECRAFT_PORT: !Ref MinecraftPort
      Events:
        GetServerStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref StatusApi
            Path: /server-status
            Method: GET

Outputs:
  ApiBaseUrl:
    Description: Set this value as NUXT_PUBLIC_API_BASE_URL in Amplify Hosting
    Value: !Sub https://${StatusApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
